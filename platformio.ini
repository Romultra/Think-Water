; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino

[env:base-ble-example]
platform = espressif32
board = esp32dev
extra_scripts = pre:./update_wokwi.py
build_src_filter = +<base/main-ble-example.cpp>
lib_ldf_mode = deep+

[env:base-main]
platform = espressif32
board = esp32dev
extra_scripts = pre:./update_wokwi.py
build_src_filter = +<base/main-base.cpp> +<base/water-turnover.cpp>
lib_deps =
	adafruit/Adafruit SHT4x Library@^1.0.4
	adafruit/Adafruit BusIO@^1.16.2
	adafruit/Adafruit Unified Sensor@^1.1.14
lib_ldf_mode = deep+


[env:coaster-main]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
extra_scripts = pre:./update_wokwi.py
build_src_filter = +<clip/main-coaster.cpp>
build_flags = 
	-DTARGET_SEEED_XIAO_NRF52840_SENSE
lib_deps = 
	bogde/HX711@^0.7.5
	seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.5
    adafruit/Adafruit SPIFlash@^5.1.1
	adafruit/Adafruit NeoPixel @ ^1.15.2