; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino

[env:base-main]
platform = espressif32
board = esp32dev
extra_scripts = pre:./update_wokwi.py
build_src_filter = +<base/main-main.cpp> +<base/oled-ssd1333.cpp> +<base/oled-ssd1333.h>
lib_deps = 
    adafruit/Adafruit SHT4x Library @ ^1.0.5
lib_ldf_mode = deep+

[env:coaster-main]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
extra_scripts = pre:./update_wokwi.py
build_src_filter = +<clip/main-main.cpp>
build_flags = 
    -DTARGET_SEEED_XIAO_NRF52840_SENSE
lib_deps =
    bogde/HX711@^0.7.5
    seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.5
    https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git
    adafruit/Adafruit SPIFlash@^5.1.1