; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino

[env:base-ble-example]
platform = espressif32
board = esp32dev
build_src_filter = +<base/main-ble-example.cpp>
lib_ldf_mode = deep+

[env:base-main]
platform = espressif32
board = esp32dev
build_src_filter = +<base/main-base.cpp> +<base/water-turnover.cpp>
lib_deps =
	adafruit/Adafruit SHT4x Library@^1.0.4
	adafruit/Adafruit BusIO@^1.16.2
	adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/RTClib@^2.1.4
lib_ldf_mode = deep+

[env:base-oled]
platform = espressif32
board = esp32dev
build_src_filter = +<base/main-oled.cpp> +<base/oled-ssd1333.cpp> +<base/oled-ssd1333.h>
lib_deps =
	adafruit/Adafruit SHT4x Library@^1.0.4
	adafruit/Adafruit GFX Library@^1.11.7

[env:base-ui]
platform = espressif32
board = esp32dev
build_src_filter = +<base/main-base-ui.cpp> +<base/water-turnover.cpp> +<base/oled-ssd1333.cpp> +<base/oled-ssd1333.h>
lib_deps =
	adafruit/Adafruit SHT4x Library@^1.0.4
	adafruit/Adafruit BusIO@^1.16.2
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit GFX Library@^1.11.7
lib_ldf_mode = deep+

[env:coaster-main]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
build_src_filter = +<clip/main-coaster.cpp>
build_flags = 
	-DTARGET_SEEED_XIAO_NRF52840_SENSE
lib_deps =
	bogde/HX711@^0.7.5
	seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.5
    adafruit/Adafruit SPIFlash@^5.1.1
	adafruit/Adafruit NeoPixel @ ^1.15.2

; ============================================================================
; Calibration Environments
; ============================================================================

[env:coaster-calibration]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
build_src_filter = +<clip/main-calibration.cpp>
build_flags =
	-DTARGET_SEEED_XIAO_NRF52840_SENSE
lib_deps =
	bogde/HX711@^0.7.5
	adafruit/Adafruit SPIFlash@^5.1.1

[env:base-calibration]
platform = espressif32
board = esp32dev
build_src_filter = +<base/main-calibration.cpp>
lib_ldf_mode = deep+